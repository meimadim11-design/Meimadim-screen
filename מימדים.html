const MIN_CELL = 30;

function mmToPx(mm) {
  return Math.max(MIN_CELL, Math.min(MAX_CELL, Math.round(mm * SCALE_PX_PER_MM)));
}

function cubeId(r, c) {
  return `${r}-${c}`;
}

function toggleCubeInMap(map, id, active) {
  const wasInActive = (map[active] || []).includes(id);
  const next = {};
  Object.keys(map).forEach((k) => {
    next[k] = map[k].filter((x) => x !== id);
  });
  if (!wasInActive) next[active] = [...(next[active] || []), id];
  return next;
}

// returns the chain of cube ids from just after fromId up to and including toId,
// walking a straight row or column; if the two cubes don't share a row/column,
// falls back to just the target cube (no auto-fill).
function pathBetween(fromId, toId) {
  const [r1, c1] = fromId.split("-").map(Number);
  const [r2, c2] = toId.split("-").map(Number);
  const path = [];
  if (r1 === r2 && c1 !== c2) {
    const step = c2 > c1 ? 1 : -1;
    for (let c = c1 + step; ; c += step) {
      path.push(cubeId(r1, c));
      if (c === c2) break;
    }
  } else if (c1 === c2 && r1 !== r2) {
    const step = r2 > r1 ? 1 : -1;
    for (let r = r1 + step; ; r += step) {
      path.push(cubeId(r, c1));
      if (r === r2) break;
    }
  } else {
    path.push(toId);
  }
  return path;
}

// clicking a new cube extends the active line: if it's in the same row/column as
// the line's last cube, every cube in between is filled in automatically.
function addCubeOrRange(map, id, active) {
  const arr = map[active] || [];
  if (arr.length > 0 && arr[0] === id) {
    return { ...map, [active]: [] };
  }
  if (arr.includes(id)) {
    return toggleCubeInMap(map, id, active);
  }
  const path = arr.length > 0 ? pathBetween(arr[arr.length - 1], id) : [id];
  const next = {};
  Object.keys(map).forEach((k) => {
    next[k] = map[k].filter((x) => !path.includes(x));
  });
  next[active] = [...(next[active] || []), ...path];
  return next;
}

function pruneMap(map, rows, cols) {
  const next = {};
  Object.keys(map).forEach((k) => {
    next[k] = map[k].filter((id) => {
      const [r, c] = id.split("-").map(Number);
      return r < rows && c < cols;
    });
  });
  return next;
}

function ensureKeys(map, count) {
  const next = {};
  for (let i = 1; i <= count; i++) next[i] = map[i] || [];
  return next;
}

  useEffect(() => {
    zoomRef.current = zoom;
  }, [zoom]);
  const designScrollRef = useRef(null);

  useEffect(() => {
    const el = designScrollRef.current;
    if (!el) return;
    let startDist = null;
    let startZoom = 1;
    function dist(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }
    function onTouchStart(e) {
      if (e.touches.length === 2) {
        startDist = dist(e.touches);
        startZoom = zoomRef.current;
      }
    }
    function onTouchMove(e) {
      if (e.touches.length === 2 && startDist) {
        e.preventDefault();
        const ratio = dist(e.touches) / startDist;
        const next = Math.max(0.2, Math.min(1.5, Math.round(startZoom * ratio * 100) / 100));
        setZoom(next);
      }
    }
    function onTouchEnd(e) {
      if (e.touches.length < 2) startDist = null;
    }
    function onWheel(e) {
      e.preventDefault();
      e.stopPropagation();
      const factor = e.deltaY < 0 ? 1.08 : 0.93;
      setZoom((z) => Math.max(0.2, Math.min(1.5, Math.round(z * factor * 100) / 100)));
    }
    function preventGesture(e) {
      e.preventDefault();
    }
    el.addEventListener("touchstart", onTouchStart, { passive: true });
    el.addEventListener("touchmove", onTouchMove, { passive: false });
    el.addEventListener("touchend", onTouchEnd, { passive: true });
    el.addEventListener("touchcancel", onTouchEnd, { passive: true });
    el.addEventListener("wheel", onWheel, { passive: false });
    // iOS Safari fires these non-standard events for native pinch-zoom,
    // bypassing normal touch handling — block them so our own zoom runs instead.
    el.addEventListener("gesturestart", preventGesture);
    el.addEventListener("gesturechange", preventGesture);
    el.addEventListener("gestureend", preventGesture);
    return () => {
      el.removeEventListener("touchstart", onTouchStart);
      el.removeEventListener("touchmove", onTouchMove);
      el.removeEventListener("touchend", onTouchEnd);
      el.removeEventListener("touchcancel", onTouchEnd);
      el.removeEventListener("wheel", onWheel);
      el.removeEventListener("gesturestart", preventGesture);
      el.removeEventListener("gesturechange", preventGesture);
      el.removeEventListener("gestureend", preventGesture);
    };
  }, [tab]);

  const [widthInput, setWidthInput] = useState(null);
  const [heightInput, setHeightInput] = useState(null);
  const [isPainting, setIsPainting] = useState(false);

  useEffect(() => {
    function stop() {
      setIsPainting(false);
    }
    window.addEventListener("mouseup", stop);
    window.addEventListener("touchend", stop);
    return () => {
      window.removeEventListener("mouseup", stop);
      window.removeEventListener("touchend", stop);
    };
  }, []);
  const [exportImg, setExportImg] = useState(null);
  const [exportBlob, setExportBlob] = useState(null);
  const exportCanvasRef = useRef(null);
  const logoImgRef = useRef(null);

  useEffect(() => {
    const img = new Image();
    img.onload = () => {
      logoImgRef.current = img;
    };
    img.src = LOGO_DATA_URL;
  }, []);

  useEffect(() => {
    setNetLines((m) => pruneMap(m, rows, cols));
    setPowerLines((m) => pruneMap(m, rows, cols));
    setSpreaders((s) => s.filter((i) => i <= cols));
    setCubeTypeMap((m) => {
      const next = {};
      Object.keys(m).forEach((id) => {
        const [r, c] = id.split("-").map(Number);
        if (r < rows && c < cols) next[id] = m[id];
      });
      return next;
    });
  }, [rows, cols]);

  useEffect(() => {
    setNetLines((m) => ensureKeys(m, netCount));
    if (activeLine > netCount && mode === "net") setActiveLine(1);
  }, [netCount]);

  useEffect(() => {
    setPowerLines((m) => ensureKeys(m, powerCount));
    if (activeLine > powerCount && mode === "power") setActiveLine(1);
  }, [powerCount]);

  useEffect(() => {
    setActiveLine(1);
  }, [mode]);

  useEffect(() => {
    setNetBackups((prev) => {
      const next = {};
      Object.entries(prev).forEach(([main, backup]) => {
        const mainUsed = (netLines[main] || []).length > 0;
        const backupUnused = (netLines[backup] || []).length === 0;
        if (mainUsed && backupUnused) next[main] = backup;
      });
      return next;
    });
  }, [netLines]);

  function getType(id) {
    const typeId = cubeTypeMap[id] || cubeTypes[0].id;
    return cubeTypes.find((t) => t.id === typeId) || cubeTypes[0];
  }

  const cubes = useMemo(() => {
    const list = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) list.push({ r, c, id: cubeId(r, c) });
    return list;
  }, [rows, cols]);

  // column width driven by row-0 cube's type, row height driven by column-0 cube's type
  const layout = useMemo(() => {
    // a column's width is set by the widest cube placed in it; a row's height by its tallest cube.
    // this way a cube can be resized anywhere on the grid, not just in row 0 / column 0.
    const colType = [];
    const rowType = [];
    for (let c = 0; c < cols; c++) {
      let best = getType(cubeId(0, c));
      for (let r = 1; r < rows; r++) {
        const t = getType(cubeId(r, c));
        if (t.w > best.w) best = t;
      }
      colType.push(best);
    }
    for (let r = 0; r < rows; r++) {
      let best = getType(cubeId(r, 0));
      for (let c = 1; c < cols; c++) {
        const t = getType(cubeId(r, c));
        if (t.h > best.h) best = t;
      }
      rowType.push(best);
    }
    const colWidths = colType.map((t) => mmToPx(t.w));
    const rowHeights = rowType.map((t) => mmToPx(t.h));
    const colOffset = [];
    let acc = 0;
    for (let c = 0; c < cols; c++) {
      colOffset.push(acc);
      acc += colWidths[c] + GAP;
    }
    const gridWidth = acc - GAP;
    const rowOffset = [];
    acc = TOP_PAD;
    for (let r = 0; r < rows; r++) {
      rowOffset.push(acc);
      acc += rowHeights[r] + GAP;
    }
    const gridHeight = acc - GAP;
    return { colWidths, rowHeights, colOffset, rowOffset, gridWidth, gridHeight, colType, rowType };
  }, [rows, cols, cubeTypes, cubeTypeMap]);

  // a cube's own visual box (may be smaller than its cell if a bigger cube shares the row/column)
  function cubeBox(id) {
    const [r, c] = id.split("-").map(Number);
    const t = getType(id);
    const cw = mmToPx(t.w);
    const ch = mmToPx(t.h);
    const x = layout.colOffset[c] + (layout.colWidths[c] - cw) / 2;
    const y = layout.rowOffset[r] + (layout.rowHeights[r] - ch) / 2;
    return { x, y, w: cw, h: ch };
  }

  function center(id) {
    const b = cubeBox(id);
    return { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  }

  const netOfCube = useMemo(() => {
    const map = {};
    Object.entries(netLines).forEach(([line, ids]) => ids.forEach((id, idx) => (map[id] = { line: Number(line), order: idx + 1, isStart: idx === 0, isEnd: idx === ids.length - 1 && ids.length > 1 })));
    return map;
  }, [netLines]);

  const powerOfCube = useMemo(() => {
    const map = {};
    Object.entries(powerLines).forEach(([line, ids]) => ids.forEach((id, idx) => (map[id] = { line: Number(line), order: idx + 1, isStart: idx === 0, isEnd: idx === ids.length - 1 && ids.length > 1 })));
    return map;
  }, [powerLines]);

  function handleCubeClick(id) {
    if (mode === "net") {
      setNetLines((prev) => addCubeOrRange(prev, id, activeLine));
    } else if (mode === "power") {
      setPowerLines((prev) => addCubeOrRange(prev, id, activeLine));
    } else if (mode === "size") {
      setCubeTypeMap((prev) => ({ ...prev, [id]: activeType }));
    }
  }

  function toggleSpreader(i) {
    setSpreaders((prev) => (prev.includes(i) ? prev.filter((x) => x !== i) : [...prev, i].sort((a, b) => a - b)));
  }

  function addType() {
    const id = "t" + Date.now();
    setCubeTypes((prev) => [...prev, { id, name: "קובייה חדשה", w: 500, h: 500, resX: 192, resY: 192 }]);
  }

  function updateType(id, patch) {
    setCubeTypes((prev) => prev.map((t) => (t.id === id ? { ...t, ...patch } : t)));
  }

  function removeType(id) {
    if (cubeTypes.length <= 1) return;
    setCubeTypes((prev) => prev.filter((t) => t.id !== id));
    setCubeTypeMap((prev) => {
      const next = {};
      Object.entries(prev).forEach(([k, v]) => {
        next[k] = v === id ? cubeTypes[0].id : v;
      });
      return next;
    });
    if (activeType === id) setActiveType(cubeTypes[0].id);
  }

  // totals
  const totalCubes = rows * cols;
  const typeCounts = useMemo(() => {
    const counts = {};
    cubeTypes.forEach((t) => (counts[t.id] = 0));
    cubes.forEach(({ id }) => {
      const t = getType(id);
      counts[t.id] = (counts[t.id] || 0) + 1;
    });
    return counts;
  }, [cubes, cubeTypeMap, cubeTypes]);

  const totalPixels = useMemo(() => cubes.reduce((s, { id }) => {
    const t = getType(id);
    return s + t.resX * t.resY;
  }, 0), [cubes, cubeTypeMap, cubeTypes]);

  const screenWidthM = (layout.colType.reduce((s, t) => s + t.w, 0) / 1000).toFixed(2);
  const screenHeightM = (layout.rowType.reduce((s, t) => s + t.h, 0) / 1000).toFixed(2);
  const totalResX = layout.colType.reduce((s, t) => s + t.resX, 0);
  const totalResY = layout.rowType.reduce((s, t) => s + t.resY, 0);

  const netUsedLines = Object.values(netLines).filter((a) => a.length > 0);
  const netJumpers = netUsedLines.reduce((s, a) => s + Math.max(a.length - 1, 0), 0);
  const netWiredCubes = new Set(netUsedLines.flat()).size;

  const powerUsedLines = Object.values(powerLines).filter((a) => a.length > 0);
  const powerJumpers = powerUsedLines.reduce((s, a) => s + Math.max(a.length - 1, 0), 0);
  const powerWiredCubes = new Set(powerUsedLines.flat()).size;

  function resetCurrent() {
    if (mode === "net") setNetLines(ensureKeys({}, netCount));
    else if (mode === "power") setPowerLines(ensureKeys({}, powerCount));
    else if (mode === "spreader") setSpreaders([]);
  }

  function commitScreenWidthM(valStr) {
    const wM = Number(valStr);
    if (wM && wM > 0) {
      const moduleWmm = cubeTypes[0].w;
      const newCols = Math.max(1, Math.min(200, Math.round((wM * 1000) / moduleWmm)));
      setCols(newCols);
    }
    setWidthInput(null);
  }

  function commitScreenHeightM(valStr) {
    const hM = Number(valStr);
    if (hM && hM > 0) {
      const moduleHmm = cubeTypes[0].h;
      const newRows = Math.max(1, Math.min(60, Math.round((hM * 1000) / moduleHmm)));
      setRows(newRows);
    }
    setHeightInput(null);
  }

  const activeCount = mode === "net" ? netCount : mode === "power" ? powerCount : 0;

  function fitToScreen() {
    if (!designScrollRef.current) return;
    const available = designScrollRef.current.clientWidth - 32;
    const next = Math.max(0.2, Math.min(1.5, available / layout.gridWidth));
    setZoom(Math.round(next * 100) / 100);
  }

  function drawArrowHead(ctx, x1, y1, x2, y2, color) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const t = 0.72; // place the arrow toward the end of the segment, not the middle
    const px = x1 + (x2 - x1) * t;
    const py = y1 + (y2 - y1) * t;
    const size = 7;
    ctx.beginPath();
    ctx.moveTo(px + size * Math.cos(angle), py + size * Math.sin(angle));
    ctx.lineTo(px + size * Math.cos(angle + 2.5), py + size * Math.sin(angle + 2.5));
    ctx.lineTo(px + size * Math.cos(angle - 2.5), py + size * Math.sin(angle - 2.5));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 0.75;
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.stroke();
  }

  function renderLayerDataURL(layer) {
    const scale = 2;
    const margin = 28;
    const titleH = 60;
    const footerH = 70;
    const W = layout.gridWidth + margin * 2;
    const H = titleH + layout.gridHeight + footerH + margin * 2;

    const canvas = exportCanvasRef.current;
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    const drawNet = layer === "both" || layer === "net";
    const drawPower = layer === "both" || layer === "power";
    const titleText = layer === "net" ? "מימדים — ניהול סקיצה למסכים — סקיצת רשת" : layer === "power" ? "מימדים — ניהול סקיצה למסכים — סקיצת חשמל" : "מימדים — ניהול סקיצה למסכים — סקיצה מלאה";

    // white background
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, W, H);

    if (logoImgRef.current) {
      const logoH = 40;
      const logoW = logoH * (logoImgRef.current.width / logoImgRef.current.height);
      const pad = 8;
      const bx = margin - pad, by = margin - 6 - pad, bw = logoW + pad * 2, bh = logoH + pad * 2;
      ctx.beginPath();
      const r = 8;
      ctx.moveTo(bx + r, by);
      ctx.arcTo(bx + bw, by, bx + bw, by + bh, r);
      ctx.arcTo(bx + bw, by + bh, bx, by + bh, r);
      ctx.arcTo(bx, by + bh, bx, by, r);
      ctx.arcTo(bx, by, bx + bw, by, r);
      ctx.closePath();
      ctx.fillStyle = "#12161D";
      ctx.fill();
      ctx.drawImage(logoImgRef.current, margin, margin - 6, logoW, logoH);
    }

    ctx.fillStyle = "#111827";
    ctx.font = "bold 19px Heebo, sans-serif";
    ctx.textAlign = "right";
    ctx.direction = "rtl";
    ctx.fillText(titleText, W - margin, margin + 20);
    ctx.fillStyle = "#4B5563";
    ctx.font = "13px Heebo, sans-serif";
    ctx.fillText(`מסך ${screenWidthM}×${screenHeightM} מ׳ · רזולוציה ${totalResX}×${totalResY}px · ${totalCubes} קוביות`, W - margin, margin + 40);

    const offX = margin;
    const offY = titleH + margin;

    // spreader poles — full screen height, drawn behind the cubes
    spreaders.forEach((i) => {
      const x = offX + (i < cols ? layout.colOffset[i] : layout.gridWidth) - (i > 0 && i < cols ? GAP / 2 : 0);
      ctx.fillStyle = SPREADER_COLOR;
      ctx.globalAlpha = 0.55;
      ctx.fillRect(x - 3, offY + 20, 6, layout.gridHeight - 20);
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(x, offY + 11, 10, 0, Math.PI * 2);
      ctx.fillStyle = SPREADER_COLOR;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#B45309";
      ctx.stroke();
    });

    // 1) cube boxes first
    cubes.forEach(({ id }) => {
      const box = cubeBox(id);
      const x = offX + box.x, y = offY + box.y, w = box.w, h = box.h;
      const type = getType(id);
      const typeIdx = cubeTypes.findIndex((t) => t.id === type.id);
      const n = netOfCube[id];
      const p = powerOfCube[id];
      const netColor = drawNet && n ? LINE_COLORS[(n.line - 1) % LINE_COLORS.length] : null;
      const powerLineColor = drawPower && p ? LINE_COLORS[(p.line - 1) % LINE_COLORS.length] : null;
      ctx.beginPath();
      const rad = 6;
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
      if (netColor && powerLineColor) {
        ctx.save();
        ctx.clip();
        ctx.fillStyle = `${netColor}55`;
        ctx.fillRect(x, y, w, h);
        ctx.beginPath();
        ctx.moveTo(x + w, y);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x, y + h);
        ctx.closePath();
        ctx.fillStyle = `${powerLineColor}55`;
        ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = netColor ? `${netColor}33` : powerLineColor ? `${powerLineColor}33` : "#F1F5F9";
        ctx.fill();
      }
      ctx.strokeStyle = netColor || powerLineColor || TYPE_SWATCHES[typeIdx % TYPE_SWATCHES.length];
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#94A3B8";
      ctx.font = "10px Heebo, sans-serif";
      ctx.textAlign = "center";
      ctx.direction = "ltr";
      ctx.fillText(`${Number(id.split("-")[0]) + 1}-${Number(id.split("-")[1]) + 1}`, x + w / 2, y + h - 6);
    });

    // 2) wiring routes drawn ON TOP of the cubes
    if (drawNet) {
      Object.entries(netLines).forEach(([line, ids]) => {
        if (ids.length < 2) return;
        const color = LINE_COLORS[(Number(line) - 1) % LINE_COLORS.length];
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.setLineDash([]);
        for (let i = 0; i < ids.length - 1; i++) {
          const p1 = center(ids[i]), p2 = center(ids[i + 1]);
          const x1 = offX + p1.x, y1 = offY + p1.y, x2 = offX + p2.x, y2 = offY + p2.y;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          drawArrowHead(ctx, x1, y1, x2, y2, color);
        }
      });
    }
    if (drawPower) {
      Object.entries(powerLines).forEach(([line, ids]) => {
        if (ids.length < 2) return;
        ctx.strokeStyle = POWER_COLOR;
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.setLineDash([7, 5]);
        for (let i = 0; i < ids.length - 1; i++) {
          const p1 = center(ids[i]), p2 = center(ids[i + 1]);
          const x1 = offX + p1.x, y1 = offY + p1.y + 8, x2 = offX + p2.x, y2 = offY + p2.y + 8;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          drawArrowHead(ctx, x1, y1, x2, y2, POWER_COLOR);
        }
        ctx.setLineDash([]);
      });
    }

    // 3) order badges on top of everything
    cubes.forEach(({ id }) => {
      const box = cubeBox(id);
      const x = offX + box.x, y = offY + box.y, w = box.w;
      const n = netOfCube[id];
      const p = powerOfCube[id];
      ctx.font = "bold 10px Heebo, sans-serif";
      ctx.textAlign = "center";
      ctx.direction = "ltr";
      if (drawNet && n) {
        ctx.fillStyle = LINE_COLORS[(n.line - 1) % LINE_COLORS.length];
        ctx.beginPath();
        ctx.arc(x + w - 11, y + 11, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = n.isStart ? "#22C55E" : n.isEnd ? "#EF4444" : "#FFFFFF";
        ctx.lineWidth = n.isStart || n.isEnd ? 2.5 : 1.5;
        ctx.stroke();
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 9px Heebo, sans-serif";
        ctx.fillText(`${n.line}.${n.order}`, x + w - 11, y + 14);
        ctx.font = "bold 10px Heebo, sans-serif";
        if (n.isEnd && netBackups[n.line]) {
          ctx.font = "bold 8px Heebo, sans-serif";
          ctx.fillStyle = "#166534";
          ctx.textAlign = "right";
          ctx.direction = "rtl";
          ctx.fillText(`גיבוי ${netBackups[n.line]}`, x + w - 24, y + 14);
          ctx.font = "bold 10px Heebo, sans-serif";
          ctx.textAlign = "center";
          ctx.direction = "ltr";
        }
      }
      if (drawPower && p) {
        ctx.fillStyle = POWER_COLOR;
        ctx.beginPath();
        ctx.arc(x + w - 11, y + 32, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = p.isStart ? "#22C55E" : p.isEnd ? "#EF4444" : "#FFFFFF";
        ctx.lineWidth = p.isStart || p.isEnd ? 2.5 : 1.5;
        ctx.stroke();
        ctx.fillStyle = "#3A2A00";
        ctx.font = "bold 9px Heebo, sans-serif";
        ctx.fillText(`${p.line}.${p.order}`, x + w - 11, y + 35);
      }
    });

    ctx.direction = "rtl";
    ctx.textAlign = "right";
    ctx.fillStyle = "#111827";
    ctx.font = "bold 14px Heebo, sans-serif";
    const footerParts = [];
    if (drawNet) footerParts.push(`רשת: ${netUsedLines.length} קווים, ${netJumpers} ג׳אמפרים`);
    if (drawPower) footerParts.push(`חשמל: ${powerUsedLines.length} קווים, ${powerJumpers} הצלבות`);
    footerParts.push(`שפרייזים: ${spreaders.length}/${spreaderTarget}`);
    ctx.fillText(footerParts.join(" · "), W - margin, titleH + margin + layout.gridHeight + 30);

    if (drawNet && Object.keys(netBackups).length > 0) {
      ctx.font = "bold 12px Heebo, sans-serif";
      ctx.fillStyle = "#4B5563";
      const backupText = "קווי גיבוי: " + Object.entries(netBackups).map(([main, backup]) => `קו ${main}→גיבוי קו ${backup}`).join(" · ");
      ctx.fillText(backupText, W - margin, titleH + margin + layout.gridHeight + 52);
    }

    // legend for start/end markers
    ctx.font = "11px Heebo, sans-serif";
    ctx.fillStyle = "#4B5563";
    ctx.fillText("← כיוון הכבל   ● טבעת ירוקה = התחלת קו   ● טבעת אדומה = סוף קו", W - margin, titleH + margin + layout.gridHeight + 8);

    return canvas.toDataURL("image/png");
  }

  function exportPNG(layer = "both") {
    const dataUrl = renderLayerDataURL(layer);
    setExportImg(dataUrl);
    const canvas = exportCanvasRef.current;
    canvas.toBlob((blob) => {
      if (blob) setExportBlob(blob);
    }, "image/png");
  }

  const [printLayers, setPrintLayers] = useState(null);

  useEffect(() => {
    function reset() {
      setPrintLayers(null);
    }
    window.addEventListener("afterprint", reset);
    return () => window.removeEventListener("afterprint", reset);
  }, []);

  function exportPDF() {
    const netUrl = renderLayerDataURL("net");
    const powerUrl = renderLayerDataURL("power");
    setPrintLayers({ net: netUrl, power: powerUrl });
    setTimeout(() => window.print(), 200);
  }

  async function shareImage() {
    if (!exportBlob) {
      alert("התמונה עדיין בהכנה, נסו שוב בעוד רגע.");
      return;
    }
    const file = new File([exportBlob], "led-wall-sketch.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "סקיצת מסך LED" });
      } catch (e) {
        // user cancelled the share sheet — nothing to do
      }
    } else {
      alert("שיתוף ישיר לא נתמך כאן. השתמשו בלחיצה ארוכה על התמונה למטה כדי לשמור אותה.");
    }
  }

  if (showSplash) {
    return (
      <div
        onClick={() => setShowSplash(false)}
        style={{
          minHeight: "100vh",
          width: "100%",
          background: "#4B5563",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          fontFamily: "'Heebo', system-ui, sans-serif",
        }}
      >
        <style>{`@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap');`}</style>
        <img src={LOGO_DATA_URL} alt="לוגו" style={{ width: 160, marginBottom: 18 }} />
        <h1 style={{ color: "#FFFFFF", fontSize: 20, fontWeight: 700, letterSpacing: 0.3 }}>מימדים</h1>
        <p style={{ color: "#D1D5DB", fontSize: 13, marginTop: 4 }}>ניהול סקיצה למסכים</p>
      </div>
    );
  }

  return (
    <div dir="rtl" style={{ fontFamily: "'Heebo', system-ui, sans-serif" }} className="min-h-screen bg-[#12161D] text-[#E7EAF0]">
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap');`}</style>

      <div className="max-w-6xl mx-auto px-4 py-6">
        <header className="mb-5 flex items-baseline justify-between flex-wrap gap-2">
          <div>

              <div className="h-px bg-[#2A3140] my-2" />
              {cubeTypes.map((t, idx) => (
                <SummaryRow key={t.id} label={<span className="flex items-center gap-1.5"><span style={{ width: 8, height: 8, borderRadius: 999, background: TYPE_SWATCHES[idx % TYPE_SWATCHES.length] }} />{t.name} ({t.w}×{t.h}מ״מ)</span>} value={`${typeCounts[t.id] || 0} קוביות`} />
              ))}
            </div>

            <div className="bg-[#1A2029] border border-[#2A3140] rounded-xl p-4">
              <h2 className="font-bold text-white mb-3">רשימת כבלים וציוד</h2>
              <SummaryRow label="קווים ראשיים — חשמל" value={powerUsedLines.length} />
              <SummaryRow label="הצלבות חשמל (ג׳אמפרים)" value={powerJumpers} />
              <SummaryRow label="קוביות מחוברות לחשמל" value={`${powerWiredCubes} / ${totalCubes}`} warn={powerWiredCubes < totalCubes} />
              <div className="h-px bg-[#2A3140] my-2" />
              <SummaryRow label="שפרייזים טלסקופיים" value={`${spreaders.length} / ${spreaderTarget}`} warn={spreaders.length !== spreaderTarget} />
              {Object.keys(netBackups).length > 0 && (
                <>
                  <div className="h-px bg-[#2A3140] my-2" />
                  <p className="text-xs text-[#8A93A6] mb-1">קווי גיבוי (רשת)</p>
                  {Object.entries(netBackups).map(([main, backup]) => (
                    <SummaryRow key={main} label={`קו ${main} (ראשי)`} value={`קו ${backup} (גיבוי)`} />
                  ))}
                </>
              )}
            </div>

            <div className="bg-[#1A2029] border border-[#2A3140] rounded-xl p-4 md:col-span-2">
              <h2 className="font-bold text-white mb-3">פירוט חשמל לפי קו (סדר המסלול)</h2>
              {Object.entries(powerLines).map(([line, ids]) => ids.length > 0 && (
                <p key={line} className="text-sm flex items-center gap-2 mb-1">
                  <span style={{ width: 10, height: 10, borderRadius: 999, background: POWER_COLOR }} />
                  קו {line}: {ids.length} קוביות, {Math.max(ids.length - 1, 0)} הצלבות — מסלול: {ids.map((id) => `[${id.split("-").map((x) => Number(x) + 1).join("-")}]`).join(" ← ")}
                </p>
              ))}
            </div>
          </section>
        )}
      </div>

      <style>{`
        .input { background: #12161D; border: 1px solid #2A3140; color: #E7EAF0; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
        .print-only { display: none; }
        @media print {
          body * { visibility: hidden; }
          .print-only, .print-only * { visibility: visible; }
          .print-only { display: block; position: absolute; top: 0; left: 0; width: 100%; }
          .print-only img { width: 100%; display: block; page-break-after: always; }
        }
      `}</style>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span className="text-[11px] text-[#8A93A6]">{label}</span>
      {children}
    </label>
  );
}

function MiniField({ label, children }) {
  return (
    <label className="flex items-center gap-1">
      <span className="text-[10px] text-[#8A93A6]">{label}</span>
      {children}
    </label>
  );
}

function SummaryRow({ label, value, warn }) {
  return (
    <div className="flex items-center justify-between py-1 text-sm">
      <span className="text-[#8A93A6]">{label}</span>
      <span className={`font-semibold ${warn ? "text-[#EB5757]" : "text-[#E7EAF0]"}`}>{value}</span>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<LedWallConfigurator />);
</script>
</body>
</html>
